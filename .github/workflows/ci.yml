name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests, lint, evaluation gate
    runs-on: ubuntu-latest
    env:
      CLINICAL_TRACE_SKIP_DOTENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type-check response contracts, persistence and evidence evaluation
        run: mypy api/v2_schemas.py src/persistence/metadata.py src/persistence/retention.py src/observability.py src/agent/evidence.py evaluation/reliability.py evaluation/guided_completeness.py --follow-imports=silent --ignore-missing-imports --check-untyped-defs
      - name: Format new modules (preserve legacy formatting)
        run: ruff format --check evaluation/readmission.py evaluation/readmission_drift.py evaluation/benchmark.py monitoring/drift_report.py src/agent/checkpoints.py src/persistence/metadata.py src/persistence/retention.py src/observability.py api/v2_schemas.py tests/test_agent_recovery.py tests/test_readmission_analysis.py tests/test_drift.py tests/test_retention.py tests/test_http_limits.py tests/test_metadata_contracts.py tests/test_observability.py api/agent_stream.py tests/test_agent_stream.py evaluation/review_agreement.py tests/test_review_agreement.py src/clinical/model_audit.py tests/test_model_audit.py evaluation/evidence_snapshot.py tests/test_public_mode.py tests/test_evidence_snapshot.py tests/test_inference_relay.py src/agent/relay.py
      - name: Tests (includes the offline evaluation gate)
        run: pytest tests/ -q --basetemp="$RUNNER_TEMP/pytest"
      - name: Format reliability evaluator and regression tests
        run: ruff format --check evaluation/reliability.py evaluation/guided_completeness.py src/agent/evidence.py tests/test_guided_completeness.py tests/test_reliability_evaluation.py tests/test_composer_reliability.py tests/test_verifier_precision.py tests/test_encounter_evidence.py
      - name: Offline agent evaluation report
        run: python -m evaluation.run_eval --no-write

  frontend:
    name: Frontend typecheck, tests, builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Dependency audit (high severity)
        run: npm audit --audit-level=high --omit=dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install real API dependencies for browser tests
        run: pip install -r ../requirements.txt
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Real-backend browser tests (desktop, tablet, mobile)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  edge:
    name: Edge Worker typecheck, tests, deploy dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            deploy/cloudflare/package-lock.json
      - name: Build the workspace served by the edge
        working-directory: frontend
        run: npm ci && npm run build:workspace
      - name: Install edge tooling
        working-directory: deploy/cloudflare
        run: npm ci
      - name: Typecheck and unit tests
        working-directory: deploy/cloudflare
        run: npm run check
      - name: Bundle and validate bindings without publishing
        working-directory: deploy/cloudflare
        run: npm run deploy:dry-run
      - name: Edge dependency audit (high severity)
        working-directory: deploy/cloudflare
        run: npm audit --audit-level=high

  security:
    name: Secret and dependency scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret pattern scan of tracked files
        run: |
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from src.security import scan_file_for_secrets
          files = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.split()
          hits = [f for f in files if Path(f).is_file() and scan_file_for_secrets(Path(f))]
          print("files scanned:", len(files))
          sys.exit(f"possible secrets in: {hits}" if hits else 0)
          PY
      - name: Python dependency audit
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r requirements.txt --progress-spinner off

  docker:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t clinical-trace-ai:ci .
      - name: Smoke test
        run: |
          docker run -d --name ct -p 8000:8000 clinical-trace-ai:ci
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8000/api/v2/system/status && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/app/ | grep -q '<div id="root">'
          curl -fsS -X POST http://127.0.0.1:8000/api/v2/agent/runs -H 'Content-Type: application/json' \
            -H 'X-Demo-Persona: clinician.demo' \
            -d '{"patient_id":"synthetic_p001","question":"Why was metformin stopped?"}' | grep -q '"outcome":"answered"'
          test "$(docker inspect -f '{{.Config.User}}' ct)" = "appuser"
          docker logs ct | tail -20
